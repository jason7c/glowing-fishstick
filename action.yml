name: 'Fishstick'
author: 'jason7c'
description: 'VNC using frp over workflow'

runs:
  using: 'composite'
  steps:
    - name: 'Build Docker image'
      shell: bash
      run: |
        docker build -t fishstick --build-arg FRP_SERVER_ADDR="$FRP_SERVER_ADDR" --build-arg FRP_CUSTOM_DOMAINS="$FRP_CUSTOM_DOMAINS" .

    - name: 'Run Docker container'
      shell: bash
      run: |
        docker run -e TZ="$TZ" -e VNC_PW="$VNC_PW" -e VNC_RESOLUTION="$VNC_RESOLUTION" docker.io/library/fishstick

branding:
  icon: 'terminal'
  color: 'gray-dark'
